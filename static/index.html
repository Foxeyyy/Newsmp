<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><title>Wave — Music</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171d28;--muted:#8d98aa;--text:#f4f6fb;--accent:#a8f06a;--line:#242c39}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#1b2a26 0,transparent 45%),var(--bg);color:var(--text);font:15px Inter,system-ui,Arial;min-height:100vh}
header{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;position:sticky;top:0;background:#090b10dd;backdrop-filter:blur(16px);z-index:4}
.logo{font-size:22px;font-weight:850;letter-spacing:-1px}.logo span{color:var(--accent)}.status{font-size:12px;color:var(--muted)}
main{max-width:1120px;margin:auto;padding:42px 24px 150px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:800}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.hero h1{font-size:clamp(34px,6vw,54px);letter-spacing:-2px;margin:8px 0}.hero p{color:var(--muted);margin:0}
.search{display:flex;gap:10px;width:min(470px,100%)}input{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;color:white;outline:none;min-width:0;flex:1;font-size:15px}input:focus{border-color:#a8f06a88}button{border:0;cursor:pointer;font-weight:750}.search button{background:var(--accent);color:#10150c;padding:0 22px;border-radius:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:32px 0 14px}.section-head h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.track{background:var(--panel);border:1px solid #ffffff09;padding:12px;border-radius:16px;cursor:pointer;transition:.2s;min-width:0}.track:hover{transform:translateY(-3px);background:var(--panel2);border-color:#a8f06a55}.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#202735}.track h3{font-size:14px;margin:11px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:38px 12px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px}
.player{position:fixed;bottom:0;left:0;right:0;background:#11151df2;backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:13px max(20px,calc((100vw - 1120px)/2));z-index:5}.player-inner{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:18px}.now{display:flex;align-items:center;gap:12px;min-width:0}.now img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#242c39}.now strong,.now small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now strong{font-size:13px}.now small{font-size:11px;color:var(--muted);margin-top:4px}.controls{text-align:center}.buttons{display:flex;align-items:center;justify-content:center;gap:20px}.buttons button{background:none;color:var(--text);font-size:18px}.buttons .play{background:var(--accent);color:#111;border-radius:50%;width:39px;height:39px;font-size:16px}.timeline{display:flex;align-items:center;gap:9px;margin-top:7px;color:var(--muted);font-size:10px}input[type=range]{padding:0;accent-color:var(--accent);height:4px}.timeline input{flex:1}.volume{display:flex;justify-content:flex-end;align-items:center;gap:10px}.volume input{max-width:100px}
@media(max-width:650px){header{height:60px;padding:0 18px}main{padding:30px 16px 150px}.hero{display:block}.search{margin-top:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{padding:10px 12px}.player-inner{grid-template-columns:1fr auto;gap:8px}.controls{grid-column:1/-1;grid-row:2}.volume{display:none}.now img{width:42px;height:42px}}
</style>
</head>
<body>
<header><div class="logo">wave<span>.</span></div><div class="status" id="status">Connecting…</div></header>
<main>
 <div class="hero"><div><div class="eyebrow">YOUR MUSIC, YOUR FLOW</div><h1>Find your sound.</h1><p>Search tracks and play them instantly.</p></div>
 <form class="search" id="searchForm"><input id="query" placeholder="Search songs, artists…" autocomplete="off"><button>Search</button></form></div>
 <div class="section-head"><h2 id="heading">Popular searches</h2><span class="hint" id="count"></span></div>
 <div class="grid" id="results"></div>
</main>
<div class="player"><div class="player-inner">
 <div class="now"><img id="art" src="" alt=""><div style="min-width:0"><strong id="trackTitle">Choose a track</strong><small id="artist">Nothing playing</small></div></div>
 <div class="controls"><div class="buttons"><button id="prev" title="Previous">↶</button><button class="play" id="toggle" title="Play">▶</button><button id="next" title="Next">↠</button></div><div class="timeline"><span id="current">0:00</span><input type="range" id="seek" min="0" max="100" value="0"><span id="duration">0:00</span></div></div>
 <div class="volume"><span>♪</span><input id="vol" type="range" min="0" max="1" step=".01" value=".85"></div>
 </div></div>
<audio id="audio" preload="none"></audio>
<script>
const $=id=>document.getElementById(id), audio=$('audio');
let tracks=[], index=-1, busy=false;
function time(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(items){tracks=items;$('results').innerHTML=items.length?items.map((t,i)=>`<article class="track" data-i="${i}"><img class="cover" loading="lazy" src="${esc(t.thumbnail)}" onerror="this.src='https://placehold.co/400x400/202735/ffffff?text=Wave'"><h3>${esc(t.title)}</h3><p>${esc(t.artist)}</p></article>`).join(''):'<div class="empty">No tracks found. Try another search.</div>'; $('count').textContent=items.length+' tracks';}
async function search(q){$('heading').textContent='Results for “'+q+'”';$('status').textContent='Searching…';$('results').innerHTML='<div class="empty">Searching music…</div>';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');render(d.results||[]);$('status').textContent='Ready · '+(d.source||'Music search')}catch(e){$('results').innerHTML='<div class="empty">'+esc(e.message)+'</div>';$('status').textContent='Search unavailable'}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim();if(q)search(q)});
$('results').addEventListener('click',e=>{const card=e.target.closest('.track');if(card)play(Number(card.dataset.i))});
async function play(i){if(i<0||i>=tracks.length)return;index=i;const t=tracks[i];$('trackTitle').textContent=t.title;$('artist').textContent=t.artist;$('art').src=t.thumbnail;$('toggle').textContent='…';$('status').textContent='Loading audio…';audio.src='/api/stream/'+encodeURIComponent(t.id);audio.load();try{await audio.play();$('toggle').textContent='Ⅱ';$('status').textContent='Now playing'}catch(e){$('toggle').textContent='▶';$('status').textContent='Playback failed · try another track'}}
$('toggle').onclick=()=>{if(!audio.src){if(tracks.length)play(0);return}if(audio.paused)audio.play().then(()=>$('toggle').textContent='Ⅱ').catch(()=>$('status').textContent='Playback blocked');else{audio.pause();$('toggle').textContent='▶'}};
$('next').onclick=()=>{if(tracks.length)play((index+1)%tracks.length)};$('prev').onclick=()=>{if(tracks.length)play((index-1+tracks.length)%tracks.length)};
audio.addEventListener('timeupdate',()=>{$('current').textContent=time(audio.currentTime);$('duration').textContent=time(audio.duration);$('seek').value=audio.duration?audio.currentTime/audio.duration*100:0});
$('seek').oninput=()=>{if(audio.duration)audio.currentTime=Number($('seek').value)/100*audio.duration};
audio.onended=()=>{if(tracks.length)play((index+1)%tracks.length);else $('toggle').textContent='▶'};
audio.onerror=()=>{$('toggle').textContent='▶';$('status').textContent='Audio unavailable · try another track'};
$('vol').oninput=()=>audio.volume=Number($('vol').value);audio.volume=.85;
$('status').textContent='Ready';
search('Arijit Singh');
</script>
</body></html>
